[project]
name = "boss-say-hello"
version = "0.1.0"
description = "Local PyQt6 BOSS job matching assistant"
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.7", "pypdf>=5", "openai>=1.70", "httpx>=0.27", "nodriver>=0.48", "keyring>=25", "platformdirs>=4"]

[project.gui-scripts]
boss-say-hello = "boss_say_hello.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-qt>=4.4", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
qt_api = "pyqt6"
addopts = "--basetemp=.cache/pytest"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
